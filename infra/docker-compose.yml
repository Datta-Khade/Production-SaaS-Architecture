# infra/docker-compose.yml
# Production-ready environment — all core services (excluding workers)

services:
  # Backend API server
  app:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.server
    ports:
      - "3009:3009"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ../.env.docker
    environment:
      - PORT=3009
      - NODE_ENV=production
    restart: unless-stopped

  # Background Worker (Email processing) - Disabled for now
  # worker:
  #   build:
  #     context: ..
  #     dockerfile: infra/docker/Dockerfile.worker
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   env_file: ../.env.docker
  #   environment:
  #     - NODE_ENV=production
  #   restart: unless-stopped

  # Frontend static serving (Nginx)
  client:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.client
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      POSTGRES_DB: master_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sailadmin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d master_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Insight (UI)
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "8001:5540"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # PgBouncer connection pooler
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_USER: postgres
      DATABASES_PASSWORD: sailadmin
      DATABASES_DBNAME: master_db
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 100
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
