# infra/docker-compose.yml
# Production-ready environment — all core services (excluding workers)

services:
  # Backend API server
  app:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.server
    ports:
      - "3009:3009"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ../.env.development
    environment:
      - PORT=3009
      - NODE_ENV=production
    restart: unless-stopped

  # Frontend static serving (Nginx)
  client:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.client
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      POSTGRES_DB: production_master
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d production_master"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PgBouncer connection pooler
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_USER: dev
      DATABASES_PASSWORD: devpassword
      DATABASES_DBNAME: production_master
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 100
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
